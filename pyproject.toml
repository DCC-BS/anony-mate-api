[project]
name = "anony-mate-backend"
version = "0.0.1"
description = "Tool for anonymize textTool for anonymize text"
authors = [
    {name = "Data Competence Center Basel-Stadt", email = "dcc@bs.ch"},
    {name = "Tobias Bollinger", email = "tobias.bollinger@bs.ch"}
]
readme = "README.md"
keywords = ['python', 'fastapi']
requires-python = ">=3.13, <3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [

    "dcc-backend-common[pydantic_ai]>=0.1.4",

    "dependency-injector>=4.48.3",
    "fastapi[standard]>=0.115.0",
    "structlog>=25.1.0",
    "python-dotenv>=1.0.1",
    "returns>=0.26.0",

    "logfire>=4.22.0",


]

[project.urls]
Homepage = "https://DCC-BS.github.io/anony-mate-backend/"
Repository = "https://github.com/DCC-BS/anony-mate-backend"
Documentation = "https://DCC-BS.github.io/anony-mate-backend/"

[project.optional-dependencies]
dev = [
    "coverage>=7.6.12",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.13",
    "version-pioneer>=0.0.13",
    "ty>=0.0.12",

]

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.13",
    "version-pioneer>=0.0.13",
    "ty>=0.0.12",

]

[build-system]
requires = ["hatchling", "version-pioneer>=0.0.13"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "version-pioneer"

[tool.hatch.build.targets.wheel]
packages = ["src/anony_mate_backend"]

[tool.uv.sources]
dcc-backend-common = { git = "https://github.com/DCC-BS/backend-common" }

[tool.uv]
exclude-newer = "P7D"
exclude-newer-package = { dcc-backend-common = "P0D" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]

ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # TRY003
    "TRY003"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true



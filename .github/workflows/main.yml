
name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    backend-ci:
        uses: DCC-BS/ci-workflows/.github/workflows/python-backend-ci.yml@v9
        with:
            python_versions: '["3.13"]'
            quality_python_version: "3.13"
            check_command: "uv lock --locked && uv run ruff format --check && uv run ruff check && uv run ty check"
            uv_version: 0.11.31


services:
  gliner-api:
      image: ghcr.io/dcc-bs/dcc-gliner-api:latest
      ports:
        - "${GLINER_PORT:-8081}:8000"
  docling-serve:
      # Marking a PDF needs a docling-serve that answers include_word_boxes
      # and carries PP-OCRv6 and PP-DocLayoutV3; the published image does not
      # yet. See dcc-docling-serve/plugins/word_boxes.py.
      image: ${DOCLING_SERVE_IMAGE:-ghcr.io/dcc-bs/dcc-docling-serve-cpu:v1.30.0}
      container_name: docling-serve-anony-mate
      ports:
          - ${DOCLING_API_PORT:-5001}:5001
      environment:
          - DOCLING_MODELS_PATH=/models
          - DOCLING_CONFIG_FILE=/app/docling_config.json
          - DOCLING_SERVE_ENABLE_UI=true
          - DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS=true
          - DOCLING_SERVE_CUSTOM_LAYOUT_PRESETS={"ppdoclayout-v3":{"kind":"ppdoclayout-v3"}}
          - HF_HOME=/models/huggingface
      volumes:
          - "${HOME:-/root}/.cache/docling:/models"

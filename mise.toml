[tools]
"github:dmno-dev/varlock" = "1.16.0"
pass-cli = "latest"
usage = "7.0.2"
uv = "0.13.1"

[plugins]
pass-cli = "https://github.com/DCC-BS/mise-proton-pass-cli"

[hooks]
postinstall = { task = "install" }
enter = { task = "enter-checks" }

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Create the virtual environment and install the pre-commit hooks"
alias = "i"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv", ".git/hooks/pre-commit"]
run = '''
if [ "${DOCKER_BUILD:-}" = "1" ]; then
    # In Docker: locked, no dev deps. The Dockerfile sets DOCKER_BUILD=1.
    uv sync --locked --no-dev
else
    # Locally: dev deps + pre-commit hooks.
    uv sync
    uv run pre-commit install
fi
'''

[tasks.env-check]
description = "Load secrets into the environment via varlock"
alias = "env"
depends = ["pass-login"]
run = "varlock load"

# ── Run ───────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the FastAPI dev server with auto-reload"
alias = "d"
depends = ["env-check"]
run = "varlock run -- uv run fastapi dev ./src/anony_mate_api/app.py --port 8000"

[tasks.run]
description = "Run the production ASGI server (uvicorn)"
alias = "r"
depends = ["env-check"]
run = "varlock run -- uv run uvicorn anony_mate_api.app:app --port 8000 --no-access-log"

# ── Quality ───────────────────────────────────────────────────────────────────

[tasks.check]
description = "Verify lockfile, format code, lint, and type-check"
alias = "c"
run = [
    "uv lock --locked",
    "uv run ruff format",
    "uv run ruff check --fix",
    "uv run ty check ./src/anony_mate_api ./lib/src",
    "varlock scan",
]

[tasks.ci-check]
description = "Verify lockfile, format code, lint, and type-check without modifying files"
run = [
    "uv lock --locked",
    "uv run ruff format --check",
    "uv run ruff check",
    "uv run ty check ./src/anony_mate_api ./lib/src",
    "varlock scan",
]

# ── Testing ───────────────────────────────────────────────────────────────────

[tasks."test:unit"]
description = "Run the test suite (including doctests), API server and client library"
alias = "t"
env = { APP_MODE = "ci" }
run = [
    "uv run python -m pytest --doctest-modules",
    "uv run --project lib python -m pytest --doctest-modules lib/tests",
]

[tasks.ci]
description = "Run all CI checks (lock, format, lint, types, tests)"
depends = ["ci-check", "test:unit"]

# ── Docker ────────────────────────────────────────────────────────────────────

[tasks."docker:up"]
description = "Start docker compose services in the background"
alias = "up"
depends = ["pass-login"]
run = "varlock run -- docker compose up -d"

[tasks."docker:down"]
description = "Stop and remove docker compose containers"
alias = "down"
run = "docker compose down"

[tasks."docker:logs"]
description = "Tail docker compose logs (follow mode)"
alias = "logs"
run = "docker compose logs -f"

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build the wheel files (API server and client library)"
depends = ["cleanup:build"]
run = [
    "uvx --from build pyproject-build --installer uv",
    "uv build --out-dir dist lib",
]

[tasks."cleanup:build"]
description = "Remove build artifacts"
run = "uv run python -c \"import shutil, os; shutil.rmtree('dist') if os.path.exists('dist') else None\""

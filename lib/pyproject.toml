[project]
name = "anony-mate-lib"
version = "0.1.1"
description = "Async Python client for the AnonyMate redaction API"
authors = [
    {name = "Data Competence Center Basel-Stadt", email = "dcc@bs.ch"},
    {name = "Tobias Bollinger", email = "tobias.bollinger@bs.ch"}
]
readme = "README.md"
keywords = ['python', 'httpx', 'anonymization', 'client']
requires-python = ">=3.15, <3.16"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.13",
]

[project.urls]
Homepage = "https://DCC-BS.github.io/anony-mate-api/"
Repository = "https://github.com/DCC-BS/anony-mate-api"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling", "version-pioneer>=0.0.13"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "version-pioneer"

[tool.hatch.build.targets.wheel]
packages = ["src/anony_mate_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["src"]

# Kept identical to the repository root's ruff configuration: the lib is a
# config boundary of its own, so settings do not flow in from the root.
[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]

ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # TRY003
    "TRY003"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
